name: 雨量預報排程抓取

on:
  schedule:
    # GitHub Actions 排程用 UTC 時間，台灣時間 = UTC+8
    # 每10分鐘跑一次；平時沒有事件時，腳本會自己判斷跳過，不會產生垃圾commit
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # 允許手動在 GitHub 網頁上按按鈕觸發，方便測試

permissions:
  contents: write  # 需要能把抓到的資料 commit 回 repo

concurrency:
  group: wpps-monitor-poll
  cancel-in-progress: false  # 避免排程重疊執行時互相打斷寫檔

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行迴歸測試（用真實樣本驗證解析邏輯沒壞）
        run: python tests/test_parse_wpps.py

      - name: 執行抓取與產生網頁
        run: python scripts/run_all.py

      - name: Commit 變更（如果有的話）
        run: |
          git config user.name "wpps-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "沒有變化，不需要commit"
          else
            git commit -m "自動更新雨量預報資料 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
